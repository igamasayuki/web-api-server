<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>キャンセル完了</title>
</head>
<body>
	<h2>キャンセル完了</h2>

	<p>クレジットカード決済のキャンセル処理が完了しました。</p>

	<div th:if="${responseCreditCardCancelApiDomain != null}">
		<h3>APIレスポンス</h3>
		<p>ステータス：<span th:text="${responseCreditCardCancelApiDomain.status}"></span></p>
		<p>メッセージ：<span th:text="${responseCreditCardCancelApiDomain.message}"></span></p>
		<p>エラーコード：<span th:text="${responseCreditCardCancelApiDomain.error_code}"></span></p>
	</div>

	<a href="/credit">入力画面に戻る</a>
</body>
</html>
